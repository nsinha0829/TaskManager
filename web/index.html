<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Assignment Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bubbly font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Baloo 2", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f9fafb;
        color: #0f172a;
      }

      .primary-button {
        padding: 0.7rem 1rem;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        background: #1e3a8a; /* dark blue */
        color: white;
        font-weight: 700;
        font-size: 0.95rem;
        box-shadow: 0 6px 16px rgba(30, 58, 138, 0.35);
        display: flex;
        gap: 0.5rem;
        align-items: center;
        justify-content: center;
        transition: transform 0.12s ease, box-shadow 0.12s ease,
          background 0.12s ease;
      }

      .primary-button:hover:not(:disabled) {
        background: #1d4ed8; /* brighter blue */
        box-shadow: 0 10px 22px rgba(30, 64, 175, 0.4);
        transform: translateY(-1px);
      }

      .primary-button:active:not(:disabled) {
        transform: translateY(0);
        box-shadow: 0 4px 12px rgba(30, 64, 175, 0.4);
      }

      .primary-button:disabled {
        opacity: 0.6;
        cursor: default;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
